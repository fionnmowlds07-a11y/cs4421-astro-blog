name: Deploy Static Site via AWS CDK
# Manual-only: the SSR build output is incompatible with this S3 deploy (see ADR-001).
# Re-enable or replace once the container deploy exists.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json
      - name: Install Project Dependencies
        run: npm ci
      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci
      - name: Build Astro Static Site
        run: npm run build
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy Infrastructure & Assets with AWS CDK
        working-directory: cdk
        run: npx cdk deploy --require-approval never
