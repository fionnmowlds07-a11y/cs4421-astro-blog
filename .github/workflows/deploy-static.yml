name: Deploy Static Site via AWS CDK
# Deploys a static release of the site (the v1.x tags, from before the move to SSR in ADR-001) to S3 behind
# CloudFront, so it can be compared with the containerised SSR version. Manual only.
# Logs in to AWS with OIDC: no AWS keys are stored in GitHub. The role only trusts runs on main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch of the static site to deploy'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the signed token it swaps for temporary AWS credentials

concurrency:
  group: deploy-static
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The CDK code comes from main; the site itself comes from the chosen static release.
      - name: Checkout Source Code (CDK)
        uses: actions/checkout@v7

      - name: Checkout Static Release ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: static-site

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            static-site/package-lock.json
            cdk/package-lock.json

      # Build it outside this repo's folder: otherwise Astro also finds main's tsconfig.json in the folder
      # above and fails, because main's node_modules isn't installed here ("Tsconfig not found").
      - name: Move the Static Release out of the Repo Folder
        run: mv static-site "$RUNNER_TEMP/static-site"

      - name: Build Static Site
        working-directory: ${{ runner.temp }}/static-site
        run: |
          npm ci
          npm run build

      # S3 can only serve plain files, so refuse an SSR build (it has a dist/server folder).
      - name: Check the Build Is Static
        run: |
          test -f "$RUNNER_TEMP/static-site/dist/index.html" || { echo "No dist/index.html: not a static build"; exit 1; }
          test ! -d "$RUNNER_TEMP/static-site/dist/server" || { echo "dist/server exists: this is an SSR build, not static"; exit 1; }

      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Infrastructure & Assets with AWS CDK
        working-directory: cdk
        env:
          STATIC_SITE_DIR: ${{ runner.temp }}/static-site/dist
        run: npx cdk deploy StaticSiteStack --require-approval never --outputs-file outputs.json

      - name: Show the Site URLs
        run: |
          url=$(jq -r '.StaticSiteStack.SiteUrl' cdk/outputs.json)
          cdn=$(jq -r '.StaticSiteStack.CloudFrontUrl' cdk/outputs.json)
          echo "Static site (${{ inputs.ref }}): $url and $cdn"
          {
            echo "### Static site (${{ inputs.ref }}) deployed"
            echo "- My domain: $url"
            echo "- CloudFront: $cdn"
          } >> "$GITHUB_STEP_SUMMARY"
