name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t astro-blog:ci .

      # Acceptance tests run against the container itself, i.e. exactly what ships.
      # Health is polled every 2s here so CI doesn't wait for the image's 30s interval.
      - name: Start container
        run: docker run -d -p 4321:4321 --health-interval=2s --name astro-blog astro-blog:ci

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' astro-blog)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Run BDD acceptance tests
        run: npm run test:bdd
        env:
          BASE_URL: http://localhost:4321

      # Real-browser tests (desktop and mobile) against the same container, so they also check what ships.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4321

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Show container logs
        if: failure()
        run: docker logs astro-blog

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber-report.html
          if-no-files-found: ignore

  # Builds the rowing database from scratch (every migration plus the sample data) in a throwaway
  # local Supabase, then lints it and runs the pgTAP tests. Only the database container is started,
  # so it takes seconds, and it never touches the real Supabase project.
  db-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (includes the pinned Supabase CLI)
        run: npm ci

      - name: Start local database and apply migrations
        run: npx supabase db start

      - name: Lint database schema
        run: npx supabase db lint --level warning --fail-on warning

      - name: Run database tests
        run: npx supabase test db

  cdk-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        run: npm ci

      - name: Type-check CDK app
        run: npm run build

      - name: Run CDK infrastructure tests
        run: npm test
