name: Push Docker Image to Amazon ECR
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: astro-blog

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Idempotent: only creates the repository on the first run. Scan-on-push checks each image for CVEs.
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository \
                 --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.tag }}
        run: |
          docker build --platform linux/amd64 -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "Pushed image: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
